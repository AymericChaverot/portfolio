# Reverse proxy devant le serveur Astro SSR.
#
# Le serveur Node sait tout servir seul ; nginx ajoute la compression, la
# mise en cache des assets immuables, des limites de débit sur l'admin et
# un point de terminaison TLS si tu en ajoutes un.

upstream portfolio_app {
    server portfolio:4321;
    keepalive 32;
}

# Limite les tentatives de connexion à l'admin (10 req/min par IP).
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Taille max d'un upload : doit rester >= MAX_UPLOAD_BYTES côté app (8 Mo).
    client_max_body_size 12M;

    # Compression du HTML rendu à la volée.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── En-têtes de sécurité ──────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Transmission des informations client ──────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";

    # ── Assets versionnés par Astro : immuables ───────────────────────────
    location /_astro/ {
        proxy_pass http://portfolio_app;
        proxy_cache_valid 200 1y;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Fichiers uploadés : noms en UUID, donc immuables aussi ────────────
    location /media/ {
        proxy_pass http://portfolio_app;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Connexion à l'admin : limitée en débit ────────────────────────────
    location = /_actions/account.login {
        limit_req zone=admin_login burst=5 nodelay;
        proxy_pass http://portfolio_app;
    }

    # ── Admin : jamais mis en cache, jamais indexé ────────────────────────
    location /admin {
        proxy_pass http://portfolio_app;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ── Sonde de santé, hors journaux ─────────────────────────────────────
    location = /healthz {
        proxy_pass http://portfolio_app;
        access_log off;
    }

    # ── Tout le reste : rendu SSR ─────────────────────────────────────────
    location / {
        proxy_pass http://portfolio_app;
    }
}
