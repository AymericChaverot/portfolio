services:
    portfolio:
        build:
            context: .
            args:
                # Doit correspondre à l'URL publique : elle sert aux balises
                # canoniques, aux liens hreflang et aux aperçus Open Graph.
                PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
        image: portfolio:latest
        container_name: portfolio
        restart: unless-stopped
        environment:
            PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
            DATABASE_PATH: /data/portfolio.db
            UPLOADS_DIR: /data/uploads
            TRUST_PROXY: "1"
        volumes:
            # Base SQLite et fichiers uploadés : c'est tout l'état du site.
            # À sauvegarder.
            - portfolio-data:/data
        expose:
            - "4321"
        networks:
            - portfolio-net

    nginx:
        image: nginx:alpine
        container_name: portfolio-nginx
        restart: unless-stopped
        ports:
            - "${HTTP_PORT:-8080}:80"
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            portfolio:
                condition: service_healthy
        networks:
            - portfolio-net

volumes:
    portfolio-data:

networks:
    portfolio-net:
